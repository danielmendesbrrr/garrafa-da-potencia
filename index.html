<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#090b13" />
  <meta name="description" content="Receba a receita Garrafa da Potência por apenas R$ 27,90." />
  <title>Garrafa da Potência | Receba a Receita</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      cursor: pointer;
      background: #080d18;
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .poster {
      position: relative;
      isolation: isolate;
      container-type: inline-size;
      width: min(100vw, 58.5dvh, 580px);
      aspect-ratio: 941 / 1672;
      overflow: hidden;
      background: #17233b;
      box-shadow: 0 18px 70px rgba(0, 0, 0, .40);
    }
    .poster > img { width: 100%; height: 100%; display: block; object-fit: cover; }
    .poster::after {
      content: "";
      position: absolute;
      inset: 65% 0 0;
      background: linear-gradient(transparent 2%, rgba(18, 4, 8, .07) 45%, rgba(0,0,0,.32));
      pointer-events: none;
      z-index: 1;
    }
    .cta-wrapper {
      position: absolute;
      z-index: 2;
      left: 6.5%;
      right: 6.5%;
      bottom: 9.1%;
    }
    .cta {
      position: relative;
      isolation: isolate;
      display: flex;
      width: 100%;
      min-height: 108px;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: .18em;
      padding: 15px 16px;
      border-radius: 25px;
      border: clamp(3px, .9cqw, 6px) solid #ffca31;
      outline: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      color: #fff;
      background: linear-gradient(178deg, #ff4b2b 0%, #e90b0f 37%, #ae000a 72%, #df1412 100%);
      box-shadow:
        0 0 0 2px rgba(255,250,173,.22) inset,
        0 0 19px rgba(255,217,63,.95),
        0 11px 16px rgba(0,0,0,.45),
        0 0 42px rgba(255,124,0,.55);
      text-align: center;
      text-decoration: none;
      transform: translateZ(0);
      animation: pulse 1.45s ease-in-out infinite;
      transition: filter .15s ease;
    }
    .cta:before {
      content: "";
      position: absolute;
      inset: -11px;
      z-index: -1;
      border-radius: 33px;
      border: 3px solid rgba(255, 211, 32, .80);
      opacity: 0;
      animation: ring 1.45s ease-out infinite;
    }
    .cta:after {
      content: "";
      position: absolute;
      inset: 3px;
      border-radius: 19px;
      background: linear-gradient(105deg, transparent 34%, rgba(255,255,255,.45) 48%, transparent 63%);
      transform: translateX(-150%);
      pointer-events: none;
      z-index: 4;
      animation: gleam 3.1s ease-in-out infinite;
    }
    .cta:focus-visible { outline: 4px solid white; outline-offset: 6px; }
    .cta:hover { filter: brightness(1.14); }
    .cta:active { transform: scale(.94); }
    .title {
      display: block;
      font-weight: 1000;
      font-size: clamp(16px, 5.65cqw, 34px);
      line-height: 1.08;
      letter-spacing: -.055em;
      white-space: nowrap;
      text-shadow: 0 3px 1px #560000, 0 5px 7px rgba(0,0,0,.6);
    }
    .price-line {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: .30em;
      line-height: 1;
      white-space: nowrap;
      font-size: clamp(13px, 4.0cqw, 23px);
      font-weight: 900;
      text-shadow: 0 2px 3px #560000;
    }
    .price {
      display: inline-block;
      background: linear-gradient(#ffe865, #f8ae00);
      border: 2px solid #fff39f;
      box-shadow: 0 3px 3px rgba(0,0,0,.33);
      padding: .19em .29em .23em;
      border-radius: .32em;
      color: #a10b06;
      font-size: 1.34em;
      font-weight: 1000;
      text-shadow: 0 1px 0 rgba(255,255,255,.25);
    }
    .arrow {
      position: absolute;
      top: 50%;
      z-index: 3;
      color: #ffec7f;
      text-shadow: 0 0 12px #ffbc19, 0 2px 7px #ff4a00;
      font-size: clamp(32px, 10cqw, 58px);
      font-weight: 900;
      line-height: 1;
      transform: translateY(-52%);
      pointer-events: none;
      animation: arrow 1s ease-in-out infinite alternate;
    }
    .arrow-left { left: -6%; }
    .arrow-right { right: -6%; animation-direction: alternate-reverse; }
    .toast {
      position: absolute;
      z-index: 9;
      left: 5%; right: 5%; bottom: 1%;
      background: rgba(12,13,18,.96);
      color: white;
      font-size: clamp(12px, 3cqw, 16px);
      line-height: 1.45;
      padding: 12px;
      text-align: center;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.25);
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
    }
    .toast.visible { opacity: 1; transform: translateY(0); }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.055); }
    }
    @keyframes ring {
      0% { transform: scale(.94); opacity: .75; }
      75%, 100% { transform: scale(1.11); opacity: 0; }
    }
    @keyframes gleam {
      0%, 24% { transform: translateX(-150%); }
      57%, 100% { transform: translateX(150%); }
    }
    @keyframes arrow {
      0% { opacity: .6; transform: translateY(-52%) scale(.9); }
      100% { opacity: 1; transform: translateY(-52%) scale(1.15); }
    }
    @media (max-width: 380px) {
      .cta { border-radius: 20px; min-height: 97px; padding: 12px 8px; }
      .cta:after { border-radius: 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cta, .cta:before, .cta:after, .arrow { animation: none !important; }
      .toast { transition: none; }
    }
  </style>
</head>
